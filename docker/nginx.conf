server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Each location sets its own add_header, so the shared headers are
    # included in every one (nginx does not inherit add_header).
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
